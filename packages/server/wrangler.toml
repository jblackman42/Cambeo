name = "cambeo-server"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2025-11-12"

[build]
command = "node scripts/bundle.mjs"
watch_dir = ["src"]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDurableObject" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[vars]
TURN_TIMEOUT_MS = "45000"
